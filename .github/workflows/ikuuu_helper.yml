name: Ikuuu_Helper

on:
  # push:
  #   branches:
  #     - main
  schedule:
    - cron: "1 16 * * *" # 该时间为UTC时间，比北京时间晚8个小时，每天早上0点1分自动执行

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 20
      - run: corepack enable
      - run: corepack install
      - run: pnpm i
      - run: pnpm run build

  send:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 20
      - name: build project
        run: |
          corepack enable
          corepack install
          pnpm i
          pnpm run build
      - name: run script
        run: npx puba run ikuuu
        env:
          # 邮箱配置
          PUBA_EMAIL_USER: ${{ secrets.EMAIL_USER }}
          PUBA_EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          PUBA_EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # ikuuu 配置
          PUBA_DOMAIN: ${{ secrets.IKUUU_DOMAIN }}
          PUBA_IKUUU_AUTH_METHOD: ${{ secrets.IKUUU_AUTH_METHOD || 'username_password' }}

          # 认证方式配置（二选一）
          # 用户名密码方式
          PUBA_USERNAME: ${{ secrets.IKUUU_USERNAME }}
          PUBA_PASSWORD: ${{ secrets.IKUUU_PASSWORD }}

          # Token 方式（优先级更高）
          PUBA_IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
