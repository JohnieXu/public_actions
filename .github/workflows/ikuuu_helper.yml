name: Ikuuu_Helper

on:
  # push:
  #   branches:
  #     - main
  schedule:
    - cron: "1 16 * * *" # 该时间为UTC时间，比北京时间晚8个小时，每天早上0点1分自动执行

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 20
      - run: corepack enable
      - run: corepack install
      - run: pnpm i
      - run: pnpm run build

  send:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 20
      - name: build project
        run: |
          corepack enable
          corepack install
          pnpm i
          pnpm run build
      - name: run script
        run: npx puba run ikuuu --email-user "${USER}" --email-pass "${PASS}" --email-to "${TO}" --domain "${DOMAIN}" --username "${USERNAME}" --password "${PASSWORD}"
        #run: node dist/ikuuu/index.js "${USER}" "${PASS}" "${TO}" "${DOMAIN}" "${USERNAME}" "${PASSWORD}"
        env:
          USER: ${{ secrets.USER }} # for email auth
          PASS: ${{ secrets.PASS }} # for email auth
          TO: ${{ secrets.TO }}
          DOMAIN: ${{ secrets.IKUUU_DOMAIN }}
          USERNAME: ${{ secrets.IKUUU_USERNAME }}
          PASSWORD: ${{ secrets.IKUUU_PASSWORD }}
