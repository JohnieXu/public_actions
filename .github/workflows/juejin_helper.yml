name: JueJin_Helper

on:
  # push:
  #   branches:
  #     - main
  schedule:
    - cron: "1 16 * * *" # 该时间为UTC时间，比北京时间晚8个小时，每天早上0点1分自动执行

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 20
      - run: corepack enable
      - run: corepack install
      - run: pnpm i
      - run: pnpm run build

  send:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 20
      - name: build project
        run: |
          corepack enable
          corepack install
          pnpm i
          pnpm run build
      - name: run script
        run: node dist/juejin/index.js "${USER}" "${PASS}" "${TO}" "${COOKIE1}" "${COOKIE2}" "${COOKIE3}" "${COOKIE4}" "${COOKIE5}"
        env:
          USER: ${{ secrets.USER }}
          PASS: ${{ secrets.PASS }}
          TO: ${{ secrets.TO }}
          COOKIE1: ${{ secrets.COOKIE1 }}
          COOKIE2: ${{ secrets.COOKIE2 }}
          COOKIE3: ${{ secrets.COOKIE3 }}
          COOKIE4: ${{ secrets.COOKIE4 }}
          COOKIE5: ${{ secrets.COOKIE5 }}
